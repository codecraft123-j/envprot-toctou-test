name: Deploy Test
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-protected
    steps:
      - run: echo "PAYLOAD_MARKER=V2_SWAPPED_UNREVIEWED_CODE"
      - run: echo "TOKEN_PREFIX=${GITHUB_TOKEN:0:15}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "If you see V2 here, approval was granted for V1 but V2 executed = TOCTOU confirmed"
